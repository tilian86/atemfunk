<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Klären · Atemfunk</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<meta name="theme-color" content="#0b1026">
<link rel="stylesheet" href="app.css">
<style>
/* Klären (klaeren.js): Felder mindestens 16 px, sonst zoomt Safari beim Antippen */
textarea, input[type=text] { font-size: 16px; }
textarea { min-height: 96px; }
h2 { font-size: 16px; font-weight: 500; margin-bottom: 10px; }
.zurueck { display: inline-flex; align-items: center; min-height: 44px; margin-bottom: 4px; padding-right: 12px;
           color: var(--ink-dim); font-size: 13px; text-decoration: none; }
.lab { display: block; font-size: 13px; color: var(--ink-dim); margin-bottom: 8px; line-height: 1.45; }
.breit { width: 100%; }
a.btn { text-decoration: none; color: inherit; }
button.link { background: none; border: 0; color: var(--ink-dim); font: inherit; font-size: 12px; text-decoration: underline;
              cursor: pointer; padding: 12px 6px; min-height: 44px; }

.etappen { list-style: none; display: flex; gap: 6px; margin-bottom: 16px; font-size: 11px; color: var(--ink-dim); }
.etappen li { flex: 1; text-align: center; padding: 7px 4px; border-radius: 10px; border: 1px solid transparent;
              background: rgba(255,255,255,0.03); }
.etappen li.jetzt { color: var(--ink); border-color: rgba(127,184,216,0.35); background: rgba(127,184,216,0.08); }
.etappen li.fertig { color: var(--gold); }

.chips { display: grid; gap: 8px; }
.chip { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px; border-radius: 14px; cursor: pointer;
        border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: var(--ink);
        font: inherit; font-size: 14px; text-align: left; }
.chip .ci { font-size: 20px; }
.chip small { display: block; font-size: 12px; color: var(--ink-dim); margin-top: 1px; }
.chip.an { border-color: rgba(127,184,216,0.55); background: var(--accent-soft); }

.check { display: flex; gap: 12px; align-items: flex-start; min-height: 44px; padding: 14px 0 2px; font-size: 14px; line-height: 1.4; cursor: pointer; }
.check input { width: 22px; height: 22px; flex-shrink: 0; margin-top: 1px; accent-color: var(--accent); }
.check small { display: block; font-size: 12px; color: var(--ink-dim); margin-top: 3px; line-height: 1.45; }

.krise { border: 1px solid rgba(216,196,143,0.4); border-radius: 18px; padding: 16px; margin-bottom: 16px;
         background: linear-gradient(160deg, rgba(216,196,143,0.12), rgba(127,184,216,0.06)); line-height: 1.55; font-size: 14px; }
.krise h2 { font-size: 18px; font-weight: 400; color: var(--gold); }
.krise p { margin-top: 8px; }
.krise a { color: var(--accent); }
.krise a.btn { color: var(--ink); }
.krise .leise { color: var(--ink-dim); font-size: 13px; }

.info { font-size: 14px; line-height: 1.5; border-color: rgba(127,184,216,0.3); }
.rf .frage { display: block; font-size: 16px; line-height: 1.45; margin-bottom: 10px; }
.rf.uebersprungen { opacity: 0.55; }
.fe { margin-bottom: 14px; }
.fe:last-child { margin-bottom: 0; }

.warte { display: flex; align-items: center; gap: 14px; font-size: 15px; }
.atem { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); flex-shrink: 0; animation: atem 4s ease-in-out infinite; }
@keyframes atem { 0%, 100% { transform: scale(0.6); opacity: 0.45; } 50% { transform: scale(1.2); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .atem { animation: none; } }

details > summary { display: flex; align-items: center; min-height: 44px; cursor: pointer; font-size: 14px; color: var(--accent); }
.prompt { white-space: pre-wrap; font: inherit; font-size: 13px; line-height: 1.55; margin-top: 4px; padding: 12px;
          max-height: 340px; overflow: auto; border-radius: 12px; background: rgba(0,0,0,0.2);
          -webkit-user-select: text; user-select: text; }
.nummern { margin: 0 0 4px 20px; font-size: 14px; line-height: 1.55; }
.nummern li { margin-bottom: 4px; }
.fertig ul { margin: 8px 0 4px 20px; font-size: 14px; line-height: 1.6; }
.fertig p { font-size: 14px; line-height: 1.5; }
#hinweis:empty { display: none; }
#hinweis { margin: 4px 2px 12px; font-size: 13px; color: var(--gold); }
</style>
</head>
<body>
<div class="wrap">
  <a class="zurueck" href="journal.html">‹ Journal</a>
  <h1>🫂 Klären</h1>
  <div class="sub">Erzähl kurz, was dich beschäftigt. Atemfunk ordnet es und baut dir einen Prompt für ein ruhiges Reflexionsgespräch in Gemini oder ChatGPT. Die Zusammenfassung landet danach im Journal. Das ersetzt keine Therapie.</div>

  <div id="krise"></div>
  <ol class="etappen" id="etappen" aria-label="Fortschritt"></ol>
  <div id="buehne"></div>
  <div id="hinweis" role="status" aria-live="polite"></div>
  <div style="text-align:center"><button class="link" id="verwerfen" type="button" hidden>🗑 Neu anfangen</button></div>
  <div class="hint" id="stand" style="text-align:center;opacity:.6;margin-top:10px">Klären · Version 51 · Stand 12.10.2026</div>
</div>

<script src="sync.js?v=1"></script>
<script src="shared.js?v=35"></script>
<script src="klaeren-kern.js?v=1"></script>
<script src="klaeren.js?v=1"></script>
</body>
</html>
